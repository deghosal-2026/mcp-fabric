name: Dependabot auto-merge
on: pull_request_target

permissions:
  pull-requests: write
  contents: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - uses: dependabot/fetch-metadata@v2
        id: fetch
      - name: Wait for merge-ready state
        if: steps.fetch.outputs.update-type == 'version-update:semver-patch' || steps.fetch.outputs.update-type == 'version-update:semver-minor'
        run: |
          for i in $(seq 1 45); do
            status=$(gh pr view "$PR_NUMBER" --json mergeStateStatus -q .mergeStateStatus)
            echo "mergeable_state=$status"
            case "$status" in
              CLEAN|UNSTABLE|HAS_HOOKS)
                break
                ;;
              *)
                sleep 20
                ;;
            esac
          done
        env:
          PR_NUMBER: ${{github.event.pull_request.number}}
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
      - name: Merge when ready
        if: steps.fetch.outputs.update-type == 'version-update:semver-patch' || steps.fetch.outputs.update-type == 'version-update:semver-minor'
        run: |
          if gh pr merge --squash "$PR_NUMBER"; then
            echo "Merged PR #$PR_NUMBER"
          else
            echo "Skipped PR #$PR_NUMBER (conflicts or failing checks)"
          fi
        env:
          PR_NUMBER: ${{github.event.pull_request.number}}
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}