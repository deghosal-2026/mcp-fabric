name: Nightly Security Fuzz

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install poetry
          poetry lock && poetry install

      - name: Run confused-deputy fuzz test
        run: |
          poetry run python tests/security/test_confused_deputy_fuzz.py \
            --iterations 40000 \
            --output /tmp/fuzz-report.json

      - name: Run lambda-clustered adversarial fuzz test
        run: |
          poetry run python tests/security/test_adversarial_confusion_fuzz.py \
            --iterations 40000 \
            --output /tmp/adversarial-fuzz-report.json

      - name: Upload report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fuzz-reports
          path: |
            /tmp/fuzz-report.json
            /tmp/adversarial-fuzz-report.json

      - name: Notify on failure
        if: failure()
        run: |
          echo "Fuzz test failed — catch rate outside thresholds (uniform baseline or band collapse)."
          echo "See fuzz-reports artifact for details."
