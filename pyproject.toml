[project]
name = "mcp-fabric"
version = "0.1.0"
description = "Composable tool mesh for MCP ecosystems"
authors = [
    {name = "Debashish Ghosal", email = "debashish@ghosal.dev"},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
keywords = ["mcp", "agent", "governance", "platform", "tool-mesh", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "greenlet>=3.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "celery[redis]>=5.4",
    "httpx>=0.27",
    "mcp>=1.0",
    "prometheus-client>=0.21",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49",
    "opentelemetry-instrumentation-sqlalchemy>=0.49",
    "opentelemetry-instrumentation-redis>=0.49",
    "structlog>=24.4",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "pyotp>=2.9",
]

[project.urls]
Homepage = "https://github.com/deghosal-2026/mcp-fabric"
Repository = "https://github.com/deghosal-2026/mcp-fabric"
Documentation = "https://github.com/deghosal-2026/mcp-fabric"

[project.scripts]
fabric-admin = "api.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"api/dependencies.py" = ["B008"]
"api/routers/*.py" = ["B008"]
"tests/*.py" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["."]
include = ["api*"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
