services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://fabric:fabric@postgres:5432/mcp_fabric
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - ADMIN_UI_URL=http://ui:3000
      - ENVIRONMENT=production
      - OPA_URL=http://opa:8181
      - SECRET_KEY=${SECRET_KEY:-mcp-fabric-docker-change-me-in-prod}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: sh -c "alembic upgrade head && uvicorn api.main:app --host 0.0.0.0 --port 8000"

  ui:
    build: ./ui
    ports:
      - "3000:3000"
    depends_on:
      - api

  worker:
    build: .
    environment:
      - DATABASE_URL=postgresql+asyncpg://fabric:fabric@postgres:5432/mcp_fabric
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: celery -A api.tasks worker -l info --concurrency=4

  beat:
    build: .
    environment:
      - DATABASE_URL=postgresql+asyncpg://fabric:fabric@postgres:5432/mcp_fabric
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: celery -A api.tasks beat -l info

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fabric
      POSTGRES_PASSWORD: fabric
      POSTGRES_DB: mcp_fabric
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fabric -d mcp_fabric"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  opa:
    image: openpolicyagent/opa:0.70.0-static
    command: ["run", "--server", "--log-level=error", "--addr=:8181"]
    ports:
      - "8181:8181"

volumes:
  pgdata:
  redisdata:
